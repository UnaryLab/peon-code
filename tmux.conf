# Responsive terminal behavior and useful integration.
set -sg escape-time 10
set -g focus-events on
set -g set-clipboard on
set -g history-limit 50000
set -g mouse on

# Keep window numbers compact after closing a window.
set -g renumber-windows on

# Compact status bar: session, windows, state indicators, host, and time.
set -g status-position bottom
set -g status-interval 5
set -g status-style 'bg=colour235,fg=colour250'
set -g status-left-length 30
set -g status-right-length 100
set -g status-left '#[bg=colour31]#[fg=colour231]#[bold] #S #[default] '
set -g window-status-separator ''
set -g window-status-format '#[fg=colour245] #I:#W#F '
set -g window-status-current-format '#[bg=colour238]#[fg=colour81]#[bold] #I:#W#F #[default]'
set -g status-right '#{?client_prefix,#[bg=colour220]#[fg=colour232]#[bold] PREFIX #[default] ,}#{?synchronize-panes,#[bg=colour160]#[fg=colour231]#[bold] SYNC #[default] ,}#{?window_zoomed_flag,#[bg=colour33]#[fg=colour231]#[bold] ZOOM #[default] ,}#[fg=colour245] #H | %a %b %d | %H:%M '
set -g message-style 'bg=colour31,fg=colour231,bold'
set -g mode-style 'bg=colour31,fg=colour231,bold'

# Show pane titles on their borders.
set -g pane-border-status top
set -g pane-border-format ' #{pane_index}: #{pane_title} '
bind T command-prompt -p 'Pane name:' 'select-pane -T "%%"'

# Intuitive splits that inherit the current pane's directory.
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'

# Prefix + g: temporary popup shell.
bind g display-popup -E -d '#{pane_current_path}' -w 85% -h 85%

# Prefix + S: send keyboard input to every pane in the window.
bind S setw synchronize-panes \; display-message 'Pane sync: #{?synchronize-panes,ON,OFF}'

# Prefix + R: enter resize mode; use arrows, then Enter/Esc/q to exit.
bind R display-message 'Resize mode: arrows; Enter/Esc/q to exit' \; switch-client -T resize
bind -T resize Left  resize-pane -L 3 \; switch-client -T resize
bind -T resize Down  resize-pane -D 3 \; switch-client -T resize
bind -T resize Up    resize-pane -U 3 \; switch-client -T resize
bind -T resize Right resize-pane -R 3 \; switch-client -T resize
bind -T resize Enter  switch-client -T root
bind -T resize Escape switch-client -T root
bind -T resize q      switch-client -T root

# Reload this file with Prefix + r.
bind r source-file ~/.tmux.conf \; display-message 'tmux.conf reloaded'
