name: test

on:
  push:
  pull_request:

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -x peon-code.sh peon-code-web.sh install.sh tests/test_peon_code.sh
      - run: tests/test_peon_code.sh
      - run: python3 -m unittest discover -s tests -p 'test_web*.py'
