<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>peon-code · Agent workspace</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/ansi.js" defer></script>
  <script src="/navigation.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="/">peon<span>•</span>code</a>
    <span class="tag">Agent workspace</span>
    <nav class="top-links" aria-label="Project links">
      <a href="https://github.com/UnaryLab/peon-code" target="_blank" rel="noopener noreferrer">GitHub</a>
      <a href="/LICENSE" target="_blank" rel="noopener">MIT License</a>
      <a href="https://www.unarylab.com/" target="_blank" rel="noopener noreferrer">© 2026 UnaryLab</a>
    </nav>
  </header>
  <main>
    <form id="new-session-form" hidden>
      <label>Project directory<input name="directory" required placeholder="Absolute or ~ path, resolved on the agent host"></label>
      <label>Session name (optional)<input name="session" placeholder="Folder basename; dots and colons become underscores"></label>
      <label>Team config (optional)<input name="config" type="file" aria-describedby="config-help"><small id="config-help">Local UTF-8 file, up to 200 KiB. Uploaded to the agent host.</small></label>
      <button type="submit">Start session</button>
      <button type="button" class="cancel">Cancel</button>
    </form>
    <p id="new-session-status" class="feedback" role="status" hidden></p>
    <div class="session-row">
      <nav id="sessions" aria-label="Sessions"></nav>
      <button id="new-session" type="button" aria-label="New session" aria-expanded="false" aria-controls="new-session-form" data-tip="Start a new session">+</button>
      <button type="button" class="font-smaller" aria-label="A- smaller text" data-tip="Smaller output text">A-</button>
      <button type="button" class="font-larger" aria-label="A+ larger text" data-tip="Larger output text">A+</button>
      <span id="connection" role="status">Connecting…</span>
      <span id="version" class="meta"></span>
    </div>
    <p id="project-path"></p>
    <p id="empty" hidden>No agent panes yet. Start a team with <code>peon-code</code>, then return here.</p>
    <div class="workspace">
      <div class="sidebar">
        <nav id="agents" aria-label="Agents in this session"></nav>
        <button id="dismiss" type="button" data-tip="Stop all agents in this session" hidden>Close session</button>
        <p id="dismiss-status" class="feedback" role="status" hidden></p>
      </div>
      <div id="panes"></div>
    </div>
  </main>
  <template id="pane-template">
    <article class="pane" hidden>
      <header class="pane-heading"><div><h2></h2><p class="meta"></p></div><span class="state">Live</span></header>
      <pre tabindex="0" class="output" aria-label="Agent output"></pre>
      <form class="message-form"><textarea rows="2" placeholder="Ask this agent something… (Shift+Enter to send)" aria-label="Message this agent"></textarea><button type="submit" data-tip="Send the message to this agent">Send ↗</button></form>
      <div class="actions">
        <button class="explain" data-tip="Ask this agent to explain the selected output" disabled>Explain selection</button>
        <span class="prompt-buttons"></span>
        <button class="discard" data-tip="Discard the saved draft" hidden>Discard saved text</button>
        <button type="button" class="add-button" aria-label="Add button" data-tip="Add a saved prompt button">+</button>
        <span class="selection-note"></span>
      </div>
      <form class="button-form" hidden>
        <label>Name<input name="name" maxlength="80" required></label>
        <label>Description<input name="description" maxlength="500"></label>
        <label>Prompt<textarea name="prompt" rows="3" maxlength="200000" required></textarea></label>
        <button type="submit">Save</button>
        <button type="button" class="cancel">Cancel</button>
      </form>
      <div class="keys">
        <button type="button" class="keys-toggle" aria-expanded="false" data-tip="Show keys to send">Keys</button>
        <div class="key-buttons" hidden>
          <button type="button" data-key="Up" data-tip="Send Up to the agent">Up</button>
          <button type="button" data-key="Down" data-tip="Send Down to the agent">Down</button>
          <button type="button" data-key="Tab" data-tip="Send Tab to the agent">Tab</button>
          <button type="button" data-key="Enter" data-tip="Send Enter to the agent">Enter</button>
          <button type="button" data-key="Escape" data-tip="Send Esc to the agent">Esc</button>
          <button type="button" data-key="Backspace" data-tip="Send Backspace to the agent">Backspace</button>
        </div>
      </div>
      <p class="feedback" role="status"></p>
    </article>
  </template>
  <div id="tip" role="tooltip" hidden></div>
</body>
</html>
